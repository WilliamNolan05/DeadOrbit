# GENERAL SETTINGS
general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = screenshot  # Takes a screenshot of your current screen and blurs it
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# TIME DISPLAY
label {
    monitor =
    text = $TIME
    color = rgba(119, 204, 0, 1.0) # Matrix green (#77cc00)
    font_size = 90
    font_family = Terminess Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# USER DISPLAY
label {
    monitor =
    text = $USER
    color = rgba(235, 219, 178, 0.8) # Off-white/cream
    font_size = 20
    font_family = Terminess Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgba(119, 204, 0, 1.0)       # Matrix green border
    inner_color = rgba(13, 14, 13, 0.9)        # Very dark background
    font_color = rgba(235, 219, 178, 1.0)      # Cream text
    fade_on_empty = false
    
    placeholder_text = <span foreground="##77cc00">Enter Password...</span>
    hide_input = false
    
    position = 0, -50
    halign = center
    valign = center
}
